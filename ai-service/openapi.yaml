            type: string
          type: array
          title: Required Processes
          description: Ordered sequence of shop-floor manufacturing operations
          examples:
          - - Fiber Laser Cutting
            - CNC Press Brake Bending
            - QC Inspection
      type: object
      required:
      - job_id
      - part_name
      - quantity
      - target_deadline
      - required_processes
      title: ProductionRecommendationRequest
    ProductionSchedulingProposal:
      properties:
        job_id:
          type: string
          title: Job Id
        job_title:
          type: string
          title: Job Title
        recommended_machine_id:
          type: string
          title: Recommended Machine Id
        recommended_machine_name:
          type: string
          title: Recommended Machine Name
        recommended_shift:
          type: string
          title: Recommended Shift
        scheduled_start:
          type: string
          title: Scheduled Start
        estimated_duration_hours:
          type: number
          title: Estimated Duration Hours
        delay_risk_score:
          type: number
          title: Delay Risk Score
          description: 0.0 to 1.0 risk index
          default: 0.15
        delay_reasons:
          items:
            type: string
          type: array
          title: Delay Reasons
        manager_approval_required:
          type: boolean
          title: Manager Approval Required
          default: true
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          default: 0.88
      type: object
      required:
      - job_id
      - job_title
      - recommended_machine_id
      - recommended_machine_name
      - recommended_shift
      - scheduled_start
      - estimated_duration_hours
      title: ProductionSchedulingProposal
    QuotationEstimate:
      properties:
        material_type:
          type: string
          title: Material Type
        material_grade:
          type: string
          title: Material Grade
        raw_material_weight_kg:
          type: number
          minimum: 0.0
          title: Raw Material Weight Kg
        scrap_rate_percentage:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Scrap Rate Percentage
          default: 12.5
        cut_length_meters:
          type: number
          minimum: 0.0
          title: Cut Length Meters
          default: 0.0
        machine_cycle_time_minutes:
          type: number
          minimum: 0.0
          title: Machine Cycle Time Minutes
        bending_strokes_count:
          type: integer
          minimum: 0.0
          title: Bending Strokes Count
          default: 0
        finishing_requirements:
          items:
            type: string
          type: array
          title: Finishing Requirements
        labor_time_minutes:
          type: number
          minimum: 0.0
          title: Labor Time Minutes
        estimated_lead_time_days:
          type: integer
          minimum: 1.0
          title: Estimated Lead Time Days
          default: 7
        confidence_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence Score
          default: 0.92
        technical_assumptions:
          items:
            type: string
          type: array
          title: Technical Assumptions
      type: object
      required:
      - material_type
      - material_grade
      - raw_material_weight_kg
      - machine_cycle_time_minutes
      - labor_time_minutes
      title: QuotationEstimate
      description: Technical estimation ONLY. Final pricing is computed by ForgeIQ
        Pricing Engine.
    QuotationEstimationRequest:
      properties:
        part_title:
          type: string
          title: Part Title
          description: Descriptive title of the manufactured component
          examples:
          - SS304 Precision Mounting Bracket
        material:
          type: string
          title: Material
          description: Base raw material specification
          examples:
          - Stainless Steel
        material_grade:
          anyOf:
          - type: string
          - type: 'null'
          title: Material Grade
          description: Standard engineering material grade
          default: '304'
          examples:
          - '304'
          - 316L
          - CRCA-IS513
        thickness:
          anyOf:
          - type: string
          - type: 'null'
          title: Thickness
          description: Raw sheet stock thickness with units
          default: 3 mm
          examples:
          - 3 mm
          - 2 mm
          - 1.5 mm
        dimensions:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimensions
          description: Outer bounding dimensions (Length x Width x Height in mm)
          default: 250 x 180 x 45 mm
          examples:
          - 250 x 180 x 45 mm
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Batch production volume
          default: 500
          examples:
          - 500
        drawing_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Drawing Reference
          description: CAD drawing or engineering reference code
          examples:
          - DWG-SS-BRK-001-REV2
        special_processes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Special Processes
          description: Specific required industrial manufacturing processes
          examples:
          - - Fiber Laser Cutting
            - CNC Press Brake Bending
            - Deburring
      type: object
      required:
      - part_title
      - material
      title: QuotationEstimationRequest
    RAGCitation:
      properties:
        source_id:
          type: string
          title: Source Id
        source_title:
          type: string
          title: Source Title
        source_type:
          type: string
          title: Source Type
        relevance_score:
          type: number
          title: Relevance Score
        snippet:
          type: string
          title: Snippet
        org_id:
          type: string
          title: Org Id
      type: object
      required:
      - source_id
      - source_title
      - source_type
      - relevance_score
      - snippet
      - org_id
      title: RAGCitation
    RFQIntakeRequest:
      properties:
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
          description: Raw text content from customer email, WhatsApp message, or
            RFQ brief
          examples:
          - 'Customer: NexaSolar Industries. Need 500 pcs SS304 brackets, 3mm thickness,
            outer dimensions 250x180mm with 4 bends. Required within 7 days in Bengaluru.'
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
          description: Original filename if document was uploaded
          examples:
          - RFQ-Nexa-Solar-Brackets.pdf
        file_type:
          anyOf:
          - type: string
          - type: 'null'
          title: File Type
          description: MIME type of uploaded document
          examples:
          - application/pdf
        file_content_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: File Content Base64
          description: Base64-encoded file payload (optional for text-only RFQs)
        sample_preset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample Preset Id
          description: Preset template identifier for benchmark verification
          examples:
          - preset-solar-bracket-500
      type: object
      title: RFQIntakeRequest
    StructuredRFQ:
      properties:
        customer_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Name
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
        part_title:
          type: string
          title: Part Title
          description: Identified manufacturing part name
        material:
          type: string
          title: Material
          description: Base material type (e.g. Stainless Steel, Aluminum)
        material_grade:
          anyOf:
          - type: string
          - type: 'null'
          title: Material Grade
          default: '304'
        thickness:
          anyOf:
          - type: string
          - type: 'null'
          title: Thickness
          default: 3 mm
        dimensions:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimensions
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          default: 1
        delivery_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Date
        priority:
          type: string
          title: Priority
          description: urgent | standard | low
          default: standard
        special_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Special Instructions
        drawing_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Drawing Reference
        required_processes:
          items:
            type: string
          type: array
          title: Required Processes
        confidence_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence Score
          default: 0.95
        field_confidences:
          additionalProperties:
            type: number
          type: object
          title: Field Confidences
        clarification_questions:
          items:
            type: string
          type: array
          title: Clarification Questions
        requires_human_verification:
          type: boolean
          title: Requires Human Verification
          default: false
      type: object
      required:
      - part_title
      - material
      title: StructuredRFQ
    TelemetryRecord:
      properties:
        request_id:
          type: string
          title: Request Id
