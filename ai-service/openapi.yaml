      summary: Multi-Agent Manufacturing Operations Copilot
      description: 'Evaluates manufacturing inquiries, machine telemetry questions,
        or quotation calculations.

        Routes intent to specialized autonomous agents:

        - **ProductionAgent**: Machine capacity, bottleneck resolution, shift schedules.

        - **InventoryAgent**: Sheet stock levels, material reservations, warehouse
        location.

        - **QuotationAgent**: Laser cutting cycle times, bending tonnage, raw material
        scrap.

        - **AnalyticsAgent**: COGS, margin variances, scrap metrics.


        Enforces strict tenant isolation via `X-Org-ID` and retrieves context from
        the company''s private RAG index.'
