  /api/v1/rag/search:
    get:
      tags:
      - RAG Retrieval
      summary: Semantic & Lexical Knowledge Base Context Search
      description: 'Direct semantic retrieval engine querying tenant-isolated engineering
        documents, machine specifications,

        material price books, and standard operating procedures.

        - Hybrid search combining 384-dimensional cosine similarity with lexical keyword
        boosting

        - Filterable by `source_type` (e.g. `machine_spec`, `material_spec`, `manual`,
        `policy`)

        - Results are ranked in descending order of `relevance_score`

        - Cross-tenant boundaries are strictly enforced via `X-Org-ID`.'
      operationId: rag_search_api_v1_rag_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          description: Semantic search query string
          examples:
          - What is the minimum bend radius for 3mm SS304 sheet metal?
          title: Q
        description: Semantic search query string
      - name: source_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional document classification filter
          examples:
          - machine_spec
          - material_spec
          title: Source Type
        description: Optional document classification filter
      - name: top_k
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          description: Maximum number of context snippets to return
          examples:
          - 4
          default: 4
          title: Top K
        description: Maximum number of context snippets to return
      - name: X-Org-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: org-forge-default
          title: X-Org-Id
      - name: X-User-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: user-default
