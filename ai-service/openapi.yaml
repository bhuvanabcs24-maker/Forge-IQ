openapi: 3.1.0
info:
  title: ForgeIQ AI Engine API
  description: '

    # ForgeIQ Industrial AI & Multi-Agent Operations Engine


    ForgeIQ is an AI-powered manufacturing intelligence and commerce platform for
    sheet-metal fabrication, CNC machining, laser cutting, and bending.


    ---


    ### Core Architectural Features

    - **100% Autonomous Local Intelligence**: Operates fully offline with zero runtime
    dependency on external LLM providers or OpenAI API keys.

    - **Deterministic Manufacturing Calculators**: Exact physics, material weight,
    laser cutting cycle time, and bending tonnage calculations run in pure deterministic
    Python algorithms outside the LLM.

    - **Tenant Isolation**: Every query and vector retrieval is strictly isolated
    by `X-Org-ID`.

    - **Structured JSON Observability**: Implements 12-factor JSON streaming logs
    with distributed request correlation (`X-Request-ID`) and performance alerts (>1000ms).


    ---


    ### Authentication & Multi-Tenancy Headers

    The microservice enforces the following headers for inter-service and client requests:

    - **`X-Org-ID`** *(string, required)*: Tenant organization ID (e.g. `org-forge-default`).

    - **`X-Service-Key`** *(string, optional in dev)*: Internal microservice authentication
    key.

    - **`X-User-ID`** *(string, optional)*: Authenticated user identifier (e.g. `usr-operator-42`).

    - **`Authorization`** *(string, optional)*: Standard `Bearer <JWT>` token. If
    provided, user identity is automatically extracted.

    - **`X-Request-ID`** *(string, optional)*: Client correlation ID. If omitted,
    the server automatically generates and returns a UUID in response headers.


    ---


    ### API Capabilities & Status

    | Feature | Implementation Status | Notes |

    | :--- | :--- | :--- |

    | **API Versioning** | **Implemented** | All business endpoints use the `/api/v1/`
    prefix. |

    | **Pagination** | **Limit-Only** | List endpoints (e.g. `/api/v1/telemetry`)
    support `?limit=N` (max 200). Cursor-based pagination (`?cursor=...`) is **Not
    currently supported**. |

    | **Filtering** | **Source-Type Only** | RAG search supports `?source_type=...`.
    Arbitrary field filtering (e.g. `?status=...`) is **Not currently supported**.
    |

    | **Sorting** | **Automatic Ranking** | RAG results are ranked by `relevance_score
    DESC`; telemetry by `timestamp DESC`. Arbitrary sorting (e.g. `?sort=-created_at`)
    is **Not currently supported**. |

    | **Query Language (DSL)**| **Not Supported** | SQL/DSL expressions such as `price
    > 50000` or `name LIKE ''sheet''` are **Not currently supported**. |

    | **Rate Limiting** | **Unavailable** | Rate limiting headers (`X-RateLimit-*`)
    are **Not currently implemented**. |

    '
  contact:
    name: ForgeIQ Engineering Team
    email: engineering@forgeiq.com
  version: 1.0.0
