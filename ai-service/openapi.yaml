tags:
- name: Health
  description: System operational readiness, active AI provider mode, and vector backend
    status.
- name: Chat & Copilot
  description: Autonomous multi-agent copilot for factory shop-floor operators and
    customer portal buyers.
- name: RFQ & Order Intake
  description: Unstructured manufacturing RFQ extraction, parameter parsing, and confidence
    scoring.
- name: Quotation Estimation
  description: Technical parameter estimation (laser cut length, cycle time, scrap
    rate, bending strokes, labor).
- name: Production AI
  description: Shop floor machine workload balancing, routing proposals, and shift
    schedule optimization.
- name: Manufacturer Matching
  description: Factory matchmaking against verified machine specifications, certifications,
    and delivery windows.
- name: Document Ingestion
  description: Tenant-isolated vector indexing of engineering drawings, machine manuals,
    and material specs.
- name: RAG Retrieval
  description: Hybrid semantic and lexical context retrieval scoped strictly to the
    requesting organization.
- name: Observability & Telemetry
  description: Execution audit records, inference latencies, and multi-agent routing
    telemetry.
