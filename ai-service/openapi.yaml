  /api/v1/telemetry:
    get:
      tags:
      - Observability & Telemetry
      summary: List Organization AI Telemetry & Observability Records
      description: 'Returns sanitized execution telemetry audit records for the authenticated
        organization.

        - Tracks `request_id`, `agent_used`, `latency_ms`, model confidence, and operational
        status.

        - **Pagination**: Supports count limiting via `?limit=N` (default 50, max
        200). Note: Cursor-based pagination (`?cursor=...`) is not currently implemented.

        - **Sorting**: Records are delivered in reverse-chronological order (most
        recent first). Arbitrary field sorting (`?sort=...`) is not currently supported.'
      operationId: get_telemetry_records_api_v1_telemetry_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum number of telemetry records to return
          examples:
          - 50
          default: 50
          title: Limit
        description: Maximum number of telemetry records to return
      - name: X-Org-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: org-forge-default
          title: X-Org-Id
      - name: X-User-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: user-default
          title: X-User-Id
      - name: X-User-Role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: factory_admin
          title: X-User-Role
      - name: X-Customer-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Customer-Id
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEnvelope_List_TelemetryRecord__'
        '400':
          description: Bad Request — Missing required tenant headers (e.g. X-Org-ID)
            or malformed request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — Missing or invalid X-Service-Key or invalid
            Authorization Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found — Requested resource or entity does not exist.
          content:
            application/json:
